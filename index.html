<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Agenda Celia — Gestão de Eventos</title>
<meta name="description" content="Agenda Celia — sistema completo de gestão de eventos, pedidos, clientes e financeiro da Celia Decorações.">

<!-- ============ PWA: instalável em Android, iOS, Windows, macOS e Linux ============ -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2A1520">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Agenda Celia">

<!-- iOS / Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda Celia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<!-- Windows -->
<meta name="msapplication-TileColor" content="#2A1520">
<meta name="msapplication-TileImage" content="icon-192.png">
<meta name="msapplication-config" content="none">

<!-- Ícones / favicons -->
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="shortcut icon" href="favicon-32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --pink:#FF6FA0;
  --pink-2:#FF9AC0;
  --pink-dark:#D63C77;
  --neon:#FF1E8E;
  --gold:#D4AF37;
  --gold-2:#F0D998;
  --black:#241621;
  --black-soft:#372430;
  --white:#FFFFFF;
  --bg:#FFF6FA;
  --surface:#FFFFFF;
  --line:#F6DCE9;
  --text:#2B1A26;
  --text-soft:#8A7583;
  --text-faint:#BBA6B4;
  --danger:#D64545;
  --ok:#2E9E6C;
  --radius-s:10px;
  --radius:16px;
  --radius-l:26px;
  --shadow-s:0 2px 10px rgba(43,26,38,.06);
  --shadow:0 10px 28px rgba(214,60,119,.14);
  --shadow-lg:0 18px 48px rgba(36,22,33,.22);
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito Sans', system-ui, -apple-system, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font-body);color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--black);letter-spacing:.2px}
p{margin:0}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:inherit;text-decoration:none}
::selection{background:var(--pink-2);color:var(--black)}
svg{display:block}

/* subtle pink/gold blob texture background */
.bg-deco{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg-deco span{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35}
.bg-deco .b1{width:260px;height:260px;background:radial-gradient(circle at 30% 30%,var(--pink-2),transparent 70%);top:-90px;left:-80px}
.bg-deco .b2{width:220px;height:220px;background:radial-gradient(circle at 60% 40%,var(--gold-2),transparent 70%);top:20%;right:-90px;opacity:.25}
.bg-deco .b3{width:200px;height:200px;background:radial-gradient(circle,var(--pink-2),transparent 70%);bottom:60px;left:-70px;opacity:.2}

/* ============ APP SHELL ============ */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:calc(12px + var(--safe-t)) 18px 12px;background:linear-gradient(135deg,var(--black) 0%,var(--black-soft) 100%);
  color:var(--white);box-shadow:var(--shadow-lg);
}
.topbar .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.topbar .brand h1{font-size:18px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .brand small{display:block;font-size:11px;color:var(--gold-2);font-weight:600;letter-spacing:.3px}
.logo-badge{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a2532,var(--black) 75%);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--gold),0 0 0 4px rgba(212,175,55,.25)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.08);color:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px}

/* Install App button (topbar) */
.btn-install{
  display:none;align-items:center;gap:7px;flex:0 0 auto;border:none;cursor:pointer;
  padding:9px 14px;border-radius:999px;font-weight:800;font-size:12.5px;white-space:nowrap;
  background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--black);
  box-shadow:0 6px 16px rgba(212,175,55,.35);animation:installPulse 2.4s ease-in-out infinite;
}
.btn-install svg{width:16px;height:16px;flex:0 0 auto}
.btn-install:active{transform:scale(.96)}
.btn-install.show{display:inline-flex}
@keyframes installPulse{0%,100%{box-shadow:0 6px 16px rgba(212,175,55,.35)}50%{box-shadow:0 6px 20px rgba(212,175,55,.65)}}
@media(max-width:380px){ .btn-install span{display:none} .btn-install{padding:9px} }
.ios-steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.ios-steps li{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--text)}
.ios-steps .num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--pink-dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.ios-steps svg{width:18px;height:18px;color:var(--pink-dark);flex:0 0 auto;margin-top:1px}

/* Layout: mobile bottom tabbar + desktop sidebar */
.shell{flex:1;display:flex;min-height:0}
.sidebar{display:none}
main#view{flex:1;min-width:0;padding:16px 16px calc(96px + var(--safe-b));max-width:1080px;margin:0 auto;width:100%}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--white);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b));
  box-shadow:0 -6px 20px rgba(43,26,38,.08);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:none;background:none;
  color:var(--text-faint);cursor:pointer;border-radius:12px;transition:color .15s,background .15s;
}
.tab svg{width:22px;height:22px}
.tab span{font-size:10.5px;font-weight:700}
.tab.active{color:var(--pink-dark)}
.tab.active svg{filter:drop-shadow(0 2px 4px rgba(255,111,160,.4))}
.tab:active{transform:scale(.95)}

/* ============ REUSABLE UI ============ */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:22px}
.page-head .sub{color:var(--text-soft);font-size:13px;margin-top:2px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;
  padding:12px 20px;font-weight:800;font-size:14.5px;cursor:pointer;transition:transform .12s, box-shadow .12s, opacity .12s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(135deg,var(--neon),var(--pink-dark));color:var(--white);box-shadow:0 8px 20px rgba(214,60,119,.35)}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:var(--black);box-shadow:0 8px 18px rgba(212,175,55,.35)}
.btn-ghost{background:var(--white);color:var(--pink-dark);border:1.5px solid var(--line)}
.btn-dark{background:var(--black);color:var(--white)}
.btn-danger{background:#FBE7E7;color:var(--danger)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

.fab{
  position:fixed;right:18px;bottom:calc(78px + var(--safe-b));z-index:35;
}

.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-s);border:1px solid var(--line);padding:16px}
.card + .card{margin-top:12px}
.section-title{font-family:var(--font-display);font-size:15px;color:var(--pink-dark);margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-quick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid-quick{grid-template-columns:repeat(4,1fr)}}

.quick-card{
  background:var(--white);border-radius:var(--radius);padding:16px 12px;text-align:center;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s;
}
.quick-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.quick-card:active{transform:scale(.97)}
.quick-ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.quick-card span{font-size:12.5px;font-weight:700;color:var(--text)}
.quick-ico svg{width:22px;height:22px}

.stat{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
.stat .lbl{font-size:13px;color:var(--text-soft);font-weight:700}
.stat .val{font-family:var(--font-display);font-size:20px;color:var(--black)}
.val.pink{color:var(--pink-dark)}
.val.neg{color:var(--danger)}
.val.ok{color:var(--ok)}

.list-item{
  display:flex;align-items:center;gap:12px;background:var(--white);border-radius:var(--radius);
  padding:14px;border:1px solid var(--line);cursor:pointer;transition:box-shadow .15s,transform .1s;
}
.list-item + .list-item{margin-top:10px}
.list-item:hover{box-shadow:var(--shadow)}
.list-item:active{transform:scale(.99)}
.list-item .bar{width:4px;align-self:stretch;border-radius:4px;flex:0 0 auto}
.list-item .ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:#FFE9F1;color:var(--pink-dark)}
.list-item .body{flex:1;min-width:0}
.list-item .body .t1{font-weight:800;font-size:14.5px;color:var(--black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .body .t2{font-size:12.5px;color:var(--text-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .end{text-align:right;flex:0 0 auto}
.list-item .end .price{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--black)}
.chev{width:18px;height:18px;color:var(--text-faint);flex:0 0 auto}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.2px}
.badge.pendente{background:#FFF1D6;color:#A9760B}
.badge.aprovacao{background:#E6E7FF;color:#4B4FCB}
.badge.andamento{background:#DCEBFF;color:#1868C9}
.badge.pagamento{background:#FFE3EE;color:var(--pink-dark)}
.badge.finalizado{background:#DDF3E8;color:var(--ok)}
.badge.cancelado{background:#F1E1E1;color:var(--danger)}

.empty{
  text-align:center;padding:44px 20px;color:var(--text-soft);
}
.empty svg{width:56px;height:56px;color:var(--pink-2);margin:0 auto 12px}
.empty h4{color:var(--black);margin-bottom:6px;font-size:16px}
.empty p{font-size:13px}

.search-bar{display:flex;align-items:center;gap:10px;background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px;margin-bottom:16px}
.search-bar svg{width:18px;height:18px;color:var(--text-faint);flex:0 0 auto}
.search-bar input{border:none;outline:none;background:none;flex:1;font-size:14.5px;color:var(--text)}

.tabs-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:9px 16px;border-radius:999px;background:var(--white);border:1.5px solid var(--line);
  font-size:13px;font-weight:800;color:var(--text-soft);cursor:pointer;white-space:nowrap;
}
.chip.active{background:var(--black);border-color:var(--black);color:var(--gold-2)}

/* form elements */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--pink-dark);margin-bottom:6px;text-transform:none}
.field input[type=text],.field input[type=tel],.field input[type=email],.field input[type=number],
.field input[type=date],.field input[type=time],.field select,.field textarea{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);
  color:var(--text);outline:none;transition:border-color .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink)}
.field textarea{resize:vertical;min-height:80px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}
.field-hint{font-size:11.5px;color:var(--text-faint);margin-top:4px}
.input-with-actions{display:flex;gap:8px;align-items:center}
.input-with-actions input,.input-with-actions select{flex:1}
.round-action{width:44px;height:44px;border-radius:12px;border:none;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;color:var(--white)}
.round-action svg{width:20px;height:20px}
.ra-whats{background:#25D366}
.ra-call{background:#3B82F6}

.row-link{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row-link:last-child{border-bottom:none}
.row-link .l{display:flex;align-items:center;gap:12px;font-weight:700;font-size:14.5px;color:var(--text)}
.row-link .l svg{width:20px;height:20px;color:var(--pink-dark)}
.row-link .r{color:var(--text-soft);font-size:13.5px;display:flex;align-items:center;gap:6px}

.divider{height:1px;background:var(--line);margin:14px 0}

/* selected item chips in pedido form */
.sel-item{display:flex;flex-direction:column;gap:8px;background:#FFF3F8;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sel-item .si-top{display:flex;align-items:center;gap:10px}
.sel-item .nm{flex:1;font-weight:700;font-size:13.5px}
.sel-item .si-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sel-item .qty{display:flex;align-items:center;gap:6px}
.qty-btn{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:var(--white);cursor:pointer;font-weight:800;color:var(--pink-dark);display:flex;align-items:center;justify-content:center}
.sel-item .disc{display:flex;align-items:center;gap:6px}
.sel-item .disc label{font-size:10.5px;font-weight:800;color:var(--text-soft);white-space:nowrap}
.disc-input{width:66px;padding:6px 7px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;text-align:right;background:var(--white);color:var(--text)}
.disc-input:focus{outline:none;border-color:var(--pink)}
.sel-item .price{font-weight:800;font-size:13px;min-width:70px;text-align:right;margin-left:auto}
.sel-item .rm{color:var(--danger);cursor:pointer;flex:0 0 auto}
.sel-item .rm svg{width:18px;height:18px}

/* Empresas terceirizadas */
.terc-item{background:#FFF3F8;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.terc-item .tc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.terc-item .tc-top .nm{font-weight:800;font-size:14px;color:var(--text)}
.terc-item .tc-actions{display:flex;gap:12px;flex:0 0 auto}
.terc-item .tc-actions span{cursor:pointer;display:flex}
.terc-item .tc-actions svg{width:17px;height:17px}
.terc-item .tc-actions .tc-edit{color:var(--pink-dark)}
.terc-item .tc-actions .tc-rm{color:var(--danger)}
.terc-item .tc-desc{font-size:12.5px;color:var(--text-soft);margin-top:3px;line-height:1.4}
.terc-item .tc-meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:13px}
.terc-item .tc-meta .qv{color:var(--text-soft);font-weight:700}
.terc-item .tc-meta .tot{font-weight:800;color:var(--pink-dark);font-size:14px}
.terc-item .tc-obs{font-size:12px;color:var(--text-faint);margin-top:6px;font-style:italic}

.total-box{background:var(--black);border-radius:var(--radius);padding:18px;color:var(--white);margin-top:6px}
.total-box .row{display:flex;justify-content:space-between;font-size:13.5px;color:#D7C3CD;padding:4px 0}
.total-box .row.grand{color:var(--gold-2);font-family:var(--font-display);font-size:22px;padding-top:10px;margin-top:6px;border-top:1px dashed rgba(255,255,255,.2)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(36,22,33,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.overlay.center{align-items:center;padding:16px}
.modal{background:var(--white);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .22s ease}
.overlay.center .modal{border-radius:24px;animation:popIn .18s ease}
@keyframes slideUp{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes popIn{from{transform:scale(.94);opacity:.5}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;flex:0 0 auto}
.modal-head h3{font-size:18px}
.modal-body{padding:6px 20px 20px;overflow-y:auto}
.modal-foot{padding:14px 20px calc(16px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:10px;flex:0 0 auto}
.modal-foot .btn{flex:1}
.handle{width:40px;height:4px;background:var(--line);border-radius:99px;margin:8px auto 0}

/* toast */
#toast-root{position:fixed;top:calc(14px + var(--safe-t));left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--black);color:var(--white);padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastIn .2s ease}
.toast.ok{background:linear-gradient(135deg,#2E9E6C,#227A54)}
.toast.err{background:linear-gradient(135deg,#D64545,#A93131)}
.toast svg{width:16px;height:16px}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head .arrow{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--white);display:flex;align-items:center;justify-content:center;cursor:pointer}
.cal-head .arrow svg{width:18px;height:18px;color:var(--pink-dark)}
.cal-head .month{font-family:var(--font-display);font-size:16px;text-transform:capitalize}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal-dow{font-size:10.5px;font-weight:800;color:var(--text-faint);padding-bottom:6px}
.cal-day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--text)}
.cal-day.other{color:var(--text-faint);opacity:.35;cursor:default}
.cal-day.today{border:1.5px solid var(--gold)}
.cal-day.selected{background:linear-gradient(135deg,var(--neon),var(--pink-dark));color:var(--white);box-shadow:var(--shadow)}
.cal-day .dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--pink-dark)}
.cal-day.selected .dot{background:var(--gold-2)}

/* documento / recibo */
.doc-tabs{display:flex;gap:8px;margin-bottom:16px}
.doc-tabs .chip{flex:1;text-align:center}
.receipt{background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-s)}
.receipt .rhead{display:flex;justify-content:space-between;gap:10px;padding:18px;background:linear-gradient(135deg,var(--black),var(--black-soft));color:var(--white)}
.receipt .rhead .co{display:flex;gap:10px;align-items:center}
.receipt .rhead .co small{display:block;color:#D7C3CD;font-size:10.5px;line-height:1.5;max-width:180px}
.receipt .rhead .meta{text-align:right;font-size:11px;color:var(--gold-2)}
.receipt .rhead .meta b{display:block;font-size:14px;color:var(--white)}
.receipt.modelB .rhead{background:var(--white);color:var(--black);border-bottom:2px solid var(--black)}
.receipt.modelB .rhead .co small{color:var(--text-soft)}
.receipt.modelB .rhead .meta{color:var(--text-soft)}
.receipt.modelB .rhead .meta b{color:var(--black)}
.receipt .rbody{padding:18px}
.receipt .cliente{font-size:13px;margin-bottom:14px}
.receipt .cliente b{display:block;font-size:14px;margin-bottom:2px}
.receipt table{width:100%;border-collapse:collapse;font-size:12.5px}
.receipt th{background:var(--black);color:var(--gold-2);text-align:left;padding:8px 10px;font-size:10.5px;letter-spacing:.3px}
.receipt th:last-child,.receipt td:last-child{text-align:right}
.receipt td{padding:8px 10px;border-bottom:1px solid var(--line)}
.receipt .totals{margin-top:14px;margin-left:auto;width:220px;font-size:12.5px}
.receipt .totals .r{display:flex;justify-content:space-between;padding:4px 10px}
.receipt .totals .r.grand{background:var(--black);color:var(--gold-2);border-radius:8px;font-weight:800;font-size:13.5px;margin-top:4px}
.receipt .foot{display:flex;justify-content:space-between;margin-top:36px;font-size:11px;text-align:center;color:var(--text-soft)}
.receipt .foot div{flex:1;border-top:1px solid var(--text-faint);padding-top:6px;margin:0 14px}
.receipt .obs{margin-top:16px;font-size:11.5px;color:var(--text-soft);background:#FFF6FA;padding:10px 12px;border-radius:10px}

/* onboarding splash */
.splash{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:40px 24px;text-align:center;background:radial-gradient(circle at 20% 0%,#FFE3EF 0%,var(--bg) 45%)}
.splash .logo-big{width:120px;height:120px;margin:0 auto 20px}
.splash h1{font-size:30px;background:linear-gradient(135deg,var(--pink-dark),var(--neon));-webkit-background-clip:text;background-clip:text;color:transparent}
.splash p.tag{color:var(--text-soft);margin:10px 0 30px;font-size:14.5px}
.splash .card{text-align:left;max-width:420px;margin:0 auto}

/* utility */
.flex{display:flex}
.gap-8{gap:8px}
.mt-8{margin-top:8px}
.mt-16{margin-top:16px}
.text-center{text-align:center}
.muted{color:var(--text-soft)}
.hide{display:none !important}

/* print */
@media print{
  body *{visibility:hidden}
  #print-area, #print-area *{visibility:visible}
  #print-area{position:absolute;left:0;top:0;width:100%}
}

/* ============ DESKTOP ============ */
@media(min-width:900px){
  .tabbar{display:none}
  .shell{max-width:1280px;margin:0 auto;width:100%}
  .sidebar{
    display:flex;flex-direction:column;width:230px;flex:0 0 auto;background:var(--white);border-right:1px solid var(--line);
    padding:20px 14px;gap:4px;position:sticky;top:64px;height:calc(100vh - 64px);
  }
  .sidebar .tab{flex-direction:row;justify-content:flex-start;padding:12px 14px;border-radius:14px;color:var(--text-soft)}
  .sidebar .tab span{font-size:13.5px}
  .sidebar .tab.active{background:#FFE9F1;color:var(--pink-dark)}
  main#view{padding:26px 32px 60px}
  .fab{right:40px;bottom:40px}
  .grid-2{grid-template-columns:1fr 1fr}
  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
  .overlay:not(.center){align-items:center;padding:20px}
  .overlay:not(.center) .modal{border-radius:24px;animation:popIn .18s ease}
}
@media(min-width:640px) and (max-width:899px){
  main#view{max-width:640px}
}
</style>
</head>

const DB_KEY = 'celia_decoracoes_db_v1';
const hasCloud = (typeof window.storage !== 'undefined' && window.storage);
function defaultDB(){
  return {
    seq: 1,
    pedidoSeq: 1,
    config:{ nome:'Celia Decorações', endereco:'', telefone:'', email:'', logo:'' },
    clientes:[], produtos:[], servicos:[], pedidos:[], agenda:[], despesas:[],
    onboarded:false
  };
}
/* Garante um contador de numeração de pedidos consistente mesmo em bancos
   antigos (importados/backup) que não possuíam este campo, evitando que
   a exclusão do pedido de maior número faça um novo pedido repetir uma
   numeração já usada. */
function ensurePedidoSeq(){
  const maiorExistente = DB.pedidos.length? Math.max(...DB.pedidos.map(p=>Number(p.numero)||0)) : 0;
  if(!DB.pedidoSeq || DB.pedidoSeq <= maiorExistente){ DB.pedidoSeq = maiorExistente + 1; }
}
function nextPedidoNumero(){
  ensurePedidoSeq();
  return DB.pedidoSeq++;
}
async function dbLoad(){
  try{
    if(hasCloud){
      const r = await window.storage.get(DB_KEY, false);
      return r && r.value ? JSON.parse(r.value) : null;
    }else{
      const raw = localStorage.getItem(DB_KEY);
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ return null; }
}
async function dbSave(){
  try{
    if(hasCloud){ await window.storage.set(DB_KEY, JSON.stringify(DB), false); }
    else{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  }catch(e){ console.warn('storage error', e); }
}
let DB = defaultDB();
function nextId(){ return 'id' + (DB.seq++) + '_' + Math.random().toString(36).slice(2,7); }

/* seed a couple of examples so the app isn't empty on first run */
function seedIfEmpty(){
  if(DB.produtos.length===0 && DB.servicos.length===0 && DB.clientes.length===0){
    DB.produtos.push(
      {id:nextId(), nome:'Mesa redonda (aluguel)', preco:15, unidade:'diária', estoque:20},
      {id:nextId(), nome:'Cadeira Tiffany (aluguel)', preco:6, unidade:'diária', estoque:120},
      {id:nextId(), nome:'Toalha de mesa', preco:8, unidade:'diária', estoque:20}
    );
    DB.servicos.push(
      {id:nextId(), nome:'Pacote Piscina Kids (até 20 pessoas)', preco:890, descricao:'Uso do espaço com piscina por 4h, decoração temática básica e monitoria.'},
      {id:nextId(), nome:'Decoração Temática Completa', preco:650, descricao:'Cenário personalizado, balões e mesa do bolo.'},
      {id:nextId(), nome:'Pacote Aniversário Adulto', preco:1200, descricao:'Espaço + decoração + mesas e cadeiras para 30 pessoas.'}
    );
  }
}

/* ======================================================================
   HELPERS
   ====================================================================== */
function fmtMoney(v){ v = Number(v)||0; return 'R$ ' + v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDateBR(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function fmtMonthLabel(y,m){ const meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']; return meses[m]+'/'+y; }
function onlyDigits(s){ return (s||'').replace(/\D/g,''); }
function waLink(phone,text){ return 'https://wa.me/'+(onlyDigits(phone) ? '55'+onlyDigits(phone) : '') + (text?('?text='+encodeURIComponent(text)):''); }
function telLink(phone){ return 'tel:'+onlyDigits(phone); }
function findCliente(id){ return DB.clientes.find(c=>c.id===id); }
function findProduto(id){ return DB.produtos.find(p=>p.id===id); }
function findServico(id){ return DB.servicos.find(s=>s.id===id); }
function pedidoTotal(p){
  let bruto=0, descontoItens=0;
  (p.produtos||[]).forEach(i=>{ const pr=findProduto(i.id); if(pr){ const b=pr.preco*i.qtd; const d=Math.min(Number(i.desconto)||0,b); bruto+=b; descontoItens+=d; } });
  (p.servicos||[]).forEach(i=>{ const sv=findServico(i.id); if(sv){ const b=sv.preco*i.qtd; const d=Math.min(Number(i.desconto)||0,b); bruto+=b; descontoItens+=d; } });
  (p.terceirizados||[]).forEach(t=>{ bruto += (Number(t.qtd)||0)*(Number(t.valor)||0); });
  const total = (bruto - descontoItens) - (Number(p.desconto)||0);
  return Math.max(total,0);
}
function statusLabel(s){
  return {pendente:'Pendente',aprovacao:'Aguardando aprovação',andamento:'Em andamento',pagamento:'Aguardando pagamento',finalizado:'Finalizado',cancelado:'Cancelado'}[s]||s;
}
function statusClass(s){ return s; }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ======================================================================
   TOAST
   ====================================================================== */
function toast(msg, type){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (type?(' '+type):'');
  el.innerHTML = (type==='ok'?ic('check',16):type==='err'?ic('x',16):'') + '<span>'+escapeHtml(msg)+'</span>';
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-8px)'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, 2400);
}

/* ======================================================================
   MODAL SYSTEM
   ====================================================================== */
let modalStack = [];
function openModal(opts){
  // opts: {title, body(html), foot(html)?, onMount(root)?, center?}
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'overlay' + (opts.center?' center':'');
  overlay.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true">'+
      (opts.center?'':'<div class="handle"></div>')+
      '<div class="modal-head"><h3>'+escapeHtml(opts.title||'')+'</h3><button class="icon-btn" data-close style="background:#F5EAF0;color:#2B1A26">'+ic('x',18)+'</button></div>'+
      '<div class="modal-body">'+opts.body+'</div>'+
      (opts.foot?('<div class="modal-foot">'+opts.foot+'</div>'):'')+
    '</div>';
  root.appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(overlay); });
  overlay.querySelectorAll('[data-close]').forEach(btn=>btn.addEventListener('click', ()=>closeModal(overlay)));
  modalStack.push(overlay);
  if(opts.onMount) opts.onMount(overlay);
  return overlay;
}
function closeModal(overlay){
  if(!overlay) overlay = modalStack[modalStack.length-1];
  if(!overlay) return;
  overlay.style.opacity='0'; overlay.style.transition='.15s';
  setTimeout(()=>{ overlay.remove(); modalStack = modalStack.filter(o=>o!==overlay); }, 150);
}
function confirmDialog(msg, okLabel){
  return new Promise(resolve=>{
    const ov = openModal({
      title:'Confirmar', center:true,
      body:'<p style="font-size:14.5px;color:#3a2c34">'+escapeHtml(msg)+'</p>',
      foot:'<button class="btn btn-ghost" data-no>Cancelar</button><button class="btn btn-danger" data-yes>'+escapeHtml(okLabel||'Excluir')+'</button>'
    });
    ov.querySelector('[data-no]').addEventListener('click',()=>{closeModal(ov); resolve(false);});
    ov.querySelector('[data-yes]').addEventListener('click',()=>{closeModal(ov); resolve(true);});
  });
}

function render(){

      '<div class="logo-badge" style="width:38px;height:38px">'+LOGO_SVG+'</div>'+

    '</header>'+
    '<div class="shell">'+
      '<nav class="sidebar">'+ ROUTES.map(r=>tabHtml(r,false)).join('') +'</nav>'+
      '<main id="view"></main>'+
    '</div>'+
    '<nav class="tabbar">'+
      tabHtml({id:'home',label:'Início',icon:'home'},true)+
      tabHtml({id:'agenda',label:'Agenda',icon:'calendar'},true)+
      tabHtml({id:'pedidos',label:'Pedidos',icon:'tag'},true)+
      tabHtml({id:'clientes',label:'Clientes',icon:'users'},true)+
      '<button class="tab" data-mais>'+ic('menu',22)+'<span>Mais</span></button>'+
    '</nav>';

  app.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.nav)));
  const mais = app.querySelector('[data-mais]');
  if(mais) mais.addEventListener('click', openMaisSheet);

  bindInstallButton();
  renderView();
}
function tabHtml(r, mobile){
  const active = state.route===r.id;
  return '<button class="tab'+(active?' active':'')+'" data-nav="'+r.id+'">'+ic(r.icon, mobile?22:20)+'<span>'+r.label+'</span></button>';
}
function openMaisSheet(){
  const ov = openModal({

/* ======================================================================
   AUTENTICAÇÃO (usuário/senha com hash SHA-256 embutido no código)
   As credenciais em texto puro NUNCA existem no código — apenas seus
   hashes SHA-256 são comparados, calculados a partir do que a pessoa digita.
   ====================================================================== */
const AUTH_SESSION_KEY = 'celia_auth_session_v1';
const AUTH_HASH = {
  u:'3979a7cc88ac279ca2d1280fc1121c93d7799321dffdab5868d046339b92383e',
  p:'e8d04a3600ee490e9bfef99f9e560c6ca3aa2833f3ab47a012abef80e90cf367'
};
async function sha256Hex(text){
  const buf = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function isAuthenticated(){ return localStorage.getItem(AUTH_SESSION_KEY) === '1'; }
function setAuthenticated(v){ if(v) localStorage.setItem(AUTH_SESSION_KEY,'1'); else localStorage.removeItem(AUTH_SESSION_KEY); }
let loginAttempts = 0, loginLockUntil = 0;

function renderLogin(){
  return '<div class="splash">'+
    '<div class="logo-big">'+LOGO_SVG+'</div>'+
    '<h1>Celia Decorações</h1>'+
    '<p class="tag" style="font-weight:800;letter-spacing:.4px;color:var(--gold);margin-bottom:2px">AGENDA CELIA</p>'+
    '<p class="tag">Área restrita — acesso somente para a equipe do espaço.</p>'+
    '<div class="card">'+
      '<div class="field"><label>Usuário</label><input type="text" id="lg-user" autocomplete="username" placeholder="Digite seu usuário"></div>'+
      '<div class="field"><label>Senha</label><div class="input-with-actions">'+
        '<input type="password" id="lg-pass" autocomplete="current-password" placeholder="Digite sua senha">'+
        '<button type="button" class="round-action ra-call" style="background:var(--black)" id="lg-toggle-pass">'+ic('eye',20)+'</button>'+
      '</div></div>'+
      '<p id="lg-error" class="hide" style="color:var(--danger);font-size:12.5px;font-weight:700;margin:-6px 0 12px">Usuário ou senha incorretos.</p>'+
      '<button class="btn btn-primary btn-block" id="lg-enter">'+ic('check',18)+' Entrar</button>'+
    '</div>'+
  '</div>';
}
function bindLogin(){
  const userEl = document.getElementById('lg-user');
  const passEl = document.getElementById('lg-pass');
  const errEl = document.getElementById('lg-error');
  document.getElementById('lg-toggle-pass').addEventListener('click', ()=>{
    passEl.type = passEl.type==='password' ? 'text' : 'password';
  });
  async function tryLogin(){
    if(Date.now() < loginLockUntil){
      errEl.textContent = 'Muitas tentativas. Aguarde alguns segundos e tente novamente.';
      errEl.classList.remove('hide');
      return;
    }
    const u = userEl.value.trim();
    const p = passEl.value;
    if(!u || !p){ errEl.textContent='Preencha usuário e senha.'; errEl.classList.remove('hide'); return; }
    const [uh, ph] = await Promise.all([sha256Hex(u), sha256Hex(p)]);
    if(uh === AUTH_HASH.u && ph === AUTH_HASH.p){
      loginAttempts = 0;
      setAuthenticated(true);
      render();
      toast('Bem-vinda de volta! 🎈','ok');
    }else{
      loginAttempts++;
      errEl.textContent='Usuário ou senha incorretos.';
      errEl.classList.remove('hide');
      passEl.value=''; passEl.focus();
      if(loginAttempts>=3){ loginLockUntil = Date.now()+8000; loginAttempts=0; }
    }
  }
  document.getElementById('lg-enter').addEventListener('click', tryLogin);
  [userEl,passEl].forEach(el=>el.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); }));
  userEl.focus();
}

function viewAgenda(){
  const cur = state.agendaCursor;
  const y=cur.getFullYear(), m=cur.getMonth();
  const first = new Date(y,m,1); const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const daysInPrev = new Date(y,m,0).getDate();
  const counts = {};
  DB.agenda.forEach(a=>{ counts[a.data]=(counts[a.data]||0)+1; });

  let cells='';
  for(let i=0;i<startDow;i++){ const dnum = daysInPrev-startDow+1+i; cells+='<div class="cal-day other">'+dnum+'</div>'; }
  for(let d=1; d<=daysInMonth; d++){
    const iso = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const isToday = iso===todayISO();
    const isSel = iso===state.agendaSelected;
    cells += '<div class="cal-day'+(isToday?' today':'')+(isSel?' selected':'')+'" data-day="'+iso+'">'+d+(counts[iso]?'<span class="dot"></span>':'')+'</div>';
  }
  const totalCells = startDow+daysInMonth;
  const rem = (7-(totalCells%7))%7;
  for(let i=1;i<=rem;i++){ cells+='<div class="cal-day other">'+i+'</div>'; }

  const doDia = DB.agenda.filter(a=>a.data===state.agendaSelected).sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));

  return ''+
  '<div class="page-head"><div><h2>Agenda</h2><p class="sub">Compromissos e eventos agendados</p></div></div>'+
  '<div class="card">'+
    '<div class="cal-head">'+
      '<button class="arrow" data-cal-prev>'+ic('back',18)+'</button>'+
      '<span class="month">'+fmtMonthLabel(y,m)+'</span>'+
      '<button class="arrow" data-cal-next>'+ic('chevron',18)+'</button>'+
    '</div>'+
    '<div class="cal-grid">'+
      ['dom','seg','ter','qua','qui','sex','sáb'].map(d=>'<div class="cal-dow">'+d+'</div>').join('')+
      cells+
    '</div>'+
  '</div>'+
  '<div class="section-title">'+ic('calendar',16)+' '+fmtDateBR(state.agendaSelected)+'</div>'+
  '<div>'+ (doDia.length ? doDia.map(a=>agendaFullRow(a)).join('') :
      '<div class="card"><div class="empty" style="padding:14px 0">'+ic('calendar',40)+'<h4>Nenhum compromisso</h4><p>Toque no botão abaixo para agendar.</p></div></div>') +'</div>'+
  '<div class="fab"><button class="btn btn-primary" id="fab-agenda">'+ic('plus',18)+' Agenda</button></div>';
}

    '<span class="badge '+statusClass(a.status)+'">'+statusLabel(a.status)+'</span>'+

      '</select></div>'+

    foot: (item? '<button class="btn btn-danger" id="ag-del">'+ic('trash',16)+'</button>':'') +
      '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="ag-save">'+ic('check',16)+' Salvar</button>'
  });
  ov.querySelector('#ag-save').addEventListener('click', async ()=>{
    const titulo = document.getElementById('ag-titulo').value.trim();
    const data = document.getElementById('ag-data').value;
    if(!titulo || !data){ toast('Preencha título e data','err'); return; }
    const obj = {

    };
    if(item){ Object.assign(item, obj); } else { DB.agenda.push(obj); }
    await dbSave(); closeModal(ov); state.agendaSelected = data; renderView();
    toast('Agenda salva','ok');

      const ok = await confirmDialog('Excluir este compromisso da agenda?');
      if(ok){ DB.agenda = DB.agenda.filter(a=>a.id!==item.id); await dbSave(); closeModal(ov); renderView(); toast('Compromisso excluído','ok'); }
    });
  }
}

function selItemRow(group, i, item){
  const bruto = item.preco*i.qtd;
  const desc = Math.min(Number(i.desconto)||0, bruto);
  return '<div class="sel-item">'+
    '<div class="si-top"><span class="nm">'+escapeHtml(item.nome)+'</span><span class="rm" data-rm="'+group+':'+i.id+'">'+ic('trash',16)+'</span></div>'+
    '<div class="si-bottom">'+
      '<span class="qty"><button class="qty-btn" data-qm="'+group+':'+i.id+'">−</button><b>'+i.qtd+'</b><button class="qty-btn" data-qp="'+group+':'+i.id+'">+</button></span>'+
      '<span class="disc"><label>Desc. R$</label><input type="number" min="0" step="0.01" class="disc-input" data-disc="'+group+':'+i.id+'" value="'+desc+'"></span>'+
      '<span class="price">'+fmtMoney(Math.max(bruto-desc,0))+'</span>'+
    '</div>'+
  '</div>';
}
function renderPedidoItens(){
  const d = window.__pedidoDraft;
  const pWrap = document.getElementById('pf-produtos-list');
  const sWrap = document.getElementById('pf-servicos-list');
  const tWrap = document.getElementById('pf-terceirizados-list');
  if(pWrap){
    pWrap.innerHTML = d.produtos.length? d.produtos.map(i=>{
      const pr = findProduto(i.id); if(!pr) return '';
      return selItemRow('produtos', i, pr);
    }).join('') : '<p class="muted" style="font-size:13px">Nenhum produto adicionado.</p>';
  }
  if(sWrap){
    sWrap.innerHTML = d.servicos.length? d.servicos.map(i=>{
      const sv = findServico(i.id); if(!sv) return '';
      return selItemRow('servicos', i, sv);
    }).join('') : '<p class="muted" style="font-size:13px">Nenhum serviço adicionado.</p>';
  }
  if(tWrap){
    tWrap.innerHTML = d.terceirizados.length? d.terceirizados.map((t,idx)=>{
      const total = (Number(t.qtd)||0)*(Number(t.valor)||0);
      return '<div class="terc-item">'+
        '<div class="tc-top"><span class="nm">'+escapeHtml(t.empresa)+'</span>'+
          '<span class="tc-actions"><span class="tc-edit" data-tc-edit="'+idx+'">'+ic('edit',17)+'</span><span class="tc-rm" data-tc-rm="'+idx+'">'+ic('trash',17)+'</span></span></div>'+
        '<div class="tc-desc">'+escapeHtml(t.item)+'</div>'+
        '<div class="tc-meta"><span class="qv">'+t.qtd+' x '+fmtMoney(t.valor)+'</span><span class="tot">'+fmtMoney(total)+'</span></div>'+
        (t.obs? '<div class="tc-obs">Obs: '+escapeHtml(t.obs)+'</div>' : '')+
      '</div>';
    }).join('') : '<p class="muted" style="font-size:13px">Nenhuma empresa terceirizada adicionada.</p>';
  }
  renderPedidoTotal();
  bindPedidoItemActions();
}
function renderPedidoTotal(){
  const d = window.__pedidoDraft;
  const descontoGeral = Number(document.getElementById('pf-desconto') ? document.getElementById('pf-desconto').value : d.desconto) || 0;
  d.desconto = descontoGeral;
  let bruto = 0, descontoItens = 0;
  d.produtos.forEach(i=>{ const pr=findProduto(i.id); if(pr){ const b=pr.preco*i.qtd; bruto+=b; descontoItens+=Math.min(Number(i.desconto)||0,b); } });
  d.servicos.forEach(i=>{ const sv=findServico(i.id); if(sv){ const b=sv.preco*i.qtd; bruto+=b; descontoItens+=Math.min(Number(i.desconto)||0,b); } });
  (d.terceirizados||[]).forEach(t=>{ bruto += (Number(t.qtd)||0)*(Number(t.valor)||0); });
  const subtotal = bruto - descontoItens;
  const total = Math.max(subtotal-descontoGeral,0);
  const wrap = document.getElementById('pf-total-wrap');
  if(wrap) wrap.innerHTML = '<div class="total-box">'+
    '<div class="row"><span>Subtotal</span><span>'+fmtMoney(bruto)+'</span></div>'+
    (descontoItens>0? '<div class="row"><span>Desconto nos itens</span><span>- '+fmtMoney(descontoItens)+'</span></div>' : '')+
    '<div class="row"><span>Desconto geral</span><span>- '+fmtMoney(descontoGeral)+'</span></div>'+
    '<div class="row grand"><span>Total</span><span>'+fmtMoney(total)+'</span></div>'+
  '</div>';
}
function bindPedidoItemActions(){
  document.querySelectorAll('[data-qp]').forEach(el=>el.addEventListener('click',()=>{ changeQty(el.dataset.qp,1); }));
  document.querySelectorAll('[data-qm]').forEach(el=>el.addEventListener('click',()=>{ changeQty(el.dataset.qm,-1); }));
  document.querySelectorAll('[data-rm]').forEach(el=>el.addEventListener('click',()=>{ removeItem(el.dataset.rm); }));
  document.querySelectorAll('[data-disc]').forEach(el=>el.addEventListener('input',()=>{ changeDiscount(el.dataset.disc, el.value, el); }));
  document.querySelectorAll('[data-tc-edit]').forEach(el=>el.addEventListener('click',()=>{ openTerceirizadoModal(Number(el.dataset.tcEdit)); }));
  document.querySelectorAll('[data-tc-rm]').forEach(el=>el.addEventListener('click',async ()=>{
    const idx = Number(el.dataset.tcRm);
    const ok = await confirmDialog('Remover esta empresa terceirizada do pedido?');
    if(ok){ window.__pedidoDraft.terceirizados.splice(idx,1); renderPedidoItens(); toast('Empresa removida','ok'); }
  }));
}
function changeQty(key,delta){
  const [group,id] = key.split(':');
  const d = window.__pedidoDraft;
  const item = d[group].find(i=>i.id===id);
  if(item){ item.qtd = Math.max(1,item.qtd+delta); renderPedidoItens(); }
}
function changeDiscount(key,value,el){
  const [group,id] = key.split(':');
  const d = window.__pedidoDraft;
  const item = d[group].find(i=>i.id===id);
  if(!item) return;
  const catalogItem = group==='produtos'? findProduto(id) : findServico(id);
  if(!catalogItem) return;
  const bruto = catalogItem.preco*item.qtd;
  item.desconto = Math.max(0, Math.min(Number(value)||0, bruto));
  const priceEl = el && el.closest('.sel-item') ? el.closest('.sel-item').querySelector('.price') : null;
  if(priceEl) priceEl.textContent = fmtMoney(Math.max(bruto-item.desconto,0));
  renderPedidoTotal();
}
function removeItem(key){
  const [group,id] = key.split(':');
  const d = window.__pedidoDraft;
  d[group] = d[group].filter(i=>i.id!==id);
  renderPedidoItens();
}
function refreshPedidoClienteSelect(selectedId){
  const sel = document.getElementById('pf-cliente');
  if(!sel) return;
  sel.innerHTML = '<option value="">Selecione o cliente</option>' + DB.clientes.map(c=>'<option value="'+c.id+'"'+(selectedId===c.id?' selected':'')+'>'+escapeHtml(c.nome)+'</option>').join('');
}
function bindPedidoForm(id){
  document.querySelector('[data-back]').addEventListener('click',()=>navigate('pedidos'));

    });

  document.getElementById('pf-ev-tipo').addEventListener('change', (e)=>{

  document.getElementById('pf-save').addEventListener('click', async ()=>{

    if(d.produtos.length===0 && d.servicos.length===0 && d.terceirizados.length===0){ toast('Adicione ao menos um produto, serviço ou empresa terceirizada','err'); return; }
    d.data = document.getElementById('pf-data').value;
    d.horario = document.getElementById('pf-horario').value;
    d.clienteId = clienteId;
    d.status = document.getElementById('pf-status').value;
    d.evento = {
      tema: document.getElementById('pf-ev-tema').value.trim(),
      nome: document.getElementById('pf-ev-nome').value.trim(),
      idade: document.getElementById('pf-ev-idade').value.trim(),
      tipo: document.getElementById('pf-ev-tipo').value,
      tipoOutro: document.getElementById('pf-ev-tipo-outro').value.trim(),
      horario: document.getElementById('pf-ev-horario').value
    };
    d.desconto = Number(document.getElementById('pf-desconto').value)||0;
    d.pagamento = document.getElementById('pf-pagamento').value;
    d.obs = document.getElementById('pf-obs').value.trim();
    d.garantia = document.getElementById('pf-garantia').value.trim();

    const existing = id? DB.pedidos.find(x=>x.id===id) : null;
    if(existing){ Object.assign(existing, d); }
    else{ d.id = nextId(); d.numero = nextPedidoNumero(); DB.pedidos.push(d); }
    await dbSave();
    toast('Pedido salvo com sucesso','ok');
    navigate('pedidos');
  });

  const docBtn = document.getElementById('pf-doc');
  if(docBtn) docBtn.addEventListener('click', ()=>navigate('documento',{id}));
  const delBtn = document.getElementById('pf-del');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    const ok = await confirmDialog('Excluir este pedido definitivamente?');
    if(ok){ DB.pedidos = DB.pedidos.filter(p=>p.id!==id); await dbSave(); toast('Pedido excluído','ok'); navigate('pedidos'); }
  });

function openPickerModal(group){
  const catalog = group==='produtos'? DB.produtos : DB.servicos;
  const d = window.__pedidoDraft;
  if(catalog.length===0){
    toast('Cadastre '+(group==='produtos'?'produtos':'serviços')+' primeiro em Estoque','err'); return;
  }
  const ov = openModal({
    title: group==='produtos'? 'Selecionar produtos':'Selecionar serviços',
    body: '<div id="picker-list">'+ catalog.map(c=>{
      const already = d[group].some(i=>i.id===c.id);
      return '<div class="row-link"><span class="l">'+escapeHtml(c.nome)+' <small class="muted" style="font-weight:600">('+fmtMoney(c.preco)+(c.unidade?('/'+c.unidade):'')+')</small></span>'+
        '<span class="r"><button class="btn btn-sm '+(already?'btn-dark':'btn-primary')+'" data-pick="'+c.id+'">'+(already?'Adicionado':'Adicionar')+'</button></span></div>';
    }).join('') +'</div>',
    foot:'<button class="btn btn-primary btn-block" data-close>Concluir</button>'
  });
  ov.querySelectorAll('[data-pick]').forEach(btn=>btn.addEventListener('click',()=>{
    const cid = btn.dataset.pick;
    if(!d[group].some(i=>i.id===cid)){ d[group].push({id:cid, qtd:1, desconto:0}); btn.textContent='Adicionado'; btn.className='btn btn-sm btn-dark'; renderPedidoItens(); }
  }));
}
function openTerceirizadoModal(idx){
  const d = window.__pedidoDraft;
  const t = (idx!=null && idx>=0)? d.terceirizados[idx] : null;
  const ov = openModal({
    title: t? 'Editar empresa terceirizada' : 'Nova empresa terceirizada',

      '<div class="field-row">'+
        '<div class="field"><label>Quantidade</label><input type="number" min="1" step="1" id="tc-qtd" value="'+(t?t.qtd:1)+'"></div>'+
        '<div class="field"><label>Valor (R$)</label><input type="number" min="0" step="0.01" id="tc-valor" value="'+(t?t.valor:0)+'"></div>'+
      '</div>'+
      '<div class="field"><label>Observação</label><textarea id="tc-obs" placeholder="Detalhes, horário de entrega, contato do responsável...">'+escapeHtml(t?t.obs:'')+'</textarea></div>',

      '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-primary" id="tc-save">'+ic('check',16)+' Salvar</button>'
  });
  ov.querySelector('#tc-save').addEventListener('click', ()=>{
    const empresa = document.getElementById('tc-empresa').value.trim();
    const item = document.getElementById('tc-item').value.trim();
    const qtd = Math.max(1, Number(document.getElementById('tc-qtd').value)||1);
    const valor = Math.max(0, Number(document.getElementById('tc-valor').value)||0);
    const obs = document.getElementById('tc-obs').value.trim();
    if(!empresa){ toast('Informe o nome da empresa','err'); return; }
    if(!item){ toast('Informe o(s) item(ns) ou serviço(s) prestado(s)','err'); return; }
    if(t){ Object.assign(t, {empresa, item, qtd, valor, obs}); }
    else { d.terceirizados.push({id:nextId(), empresa, item, qtd, valor, obs}); }
    closeModal(ov);
    renderPedidoItens();
    toast('Empresa terceirizada salva','ok');
  });
  if(t){
    ov.querySelector('#tc-del').addEventListener('click', async ()=>{
      const ok = await confirmDialog('Remover esta empresa terceirizada do pedido?');
      if(ok){ d.terceirizados = d.terceirizados.filter(x=>x.id!==t.id); closeModal(ov); renderPedidoItens(); toast('Empresa removida','ok'); }
    });
  }
}

function viewFinanceiro(){
  const cur = state.finCursor; const y=cur.getFullYear(), m=cur.getMonth();
  const prefix = y+'-'+String(m+1).padStart(2,'0');
  const pedidosMes = DB.pedidos.filter(p=>p.data && p.data.startsWith(prefix));
  const finalizadosMes = pedidosMes.filter(p=>p.status==='finalizado');
  const recebimentos = finalizadosMes.reduce((s,p)=>s+pedidoTotal(p),0);
  const despesasMes = DB.despesas.filter(d=>d.data && d.data.startsWith(prefix));
  const totalDespesas = despesasMes.reduce((s,d)=>s+Number(d.valor||0),0);
  const saldo = recebimentos - totalDespesas;

  return ''+
  '<div class="page-head"><div><h2>Financeiro</h2><p class="sub">Resumo mensal do seu negócio</p></div></div>'+
  '<div class="cal-head" style="margin-bottom:16px">'+
    '<button class="arrow" data-fin-prev>'+ic('back',18)+'</button>'+
    '<span class="month" style="background:linear-gradient(135deg,var(--neon),var(--pink-dark));color:#fff;padding:8px 18px;border-radius:999px;font-size:14px">'+fmtMonthLabel(y,m)+'</span>'+
    '<button class="arrow" data-fin-next>'+ic('chevron',18)+'</button>'+
  '</div>'+
  '<div class="section-title">'+ic('tag',16)+' Pedidos</div>'+
  '<div class="card">'+
    '<div class="stat"><span class="lbl">Finalizados no mês</span><span class="val pink">'+fmtMoney(recebimentos)+'</span></div>'+
    '<div class="stat"><span class="lbl">Total de pedidos no mês</span><span class="val">'+pedidosMes.length+'</span></div>'+
  '</div>'+
  '<div class="section-title">'+ic('dollar',16)+' Receitas × Despesas</div>'+
  '<div class="card">'+
    '<div class="stat"><span class="lbl">Recebimentos</span><span class="val ok">'+fmtMoney(recebimentos)+'</span></div>'+
    '<div class="stat"><span class="lbl">Despesas</span><span class="val neg">- '+fmtMoney(totalDespesas)+'</span></div>'+
    '<div class="stat"><span class="lbl">Saldo do mês</span><span class="val" style="color:'+(saldo>=0?'var(--ok)':'var(--danger)')+'">'+fmtMoney(saldo)+'</span></div>'+
  '</div>'+
  '<div class="section-title">'+ic('wallet',16)+' Despesas do mês</div>'+
  '<div>'+(despesasMes.length? despesasMes.map(d=>despesaRow(d)).join('') :
    '<div class="card"><div class="empty" style="padding:16px 0">'+ic('wallet',36)+'<h4>Nenhuma despesa lançada</h4></div></div>')+'</div>'+
  '<div class="fab"><button class="btn btn-primary" id="fab-despesa">'+ic('plus',18)+' Despesa</button></div>';
}

    '<div class="body"><div class="t1">'+escapeHtml(d.descricao)+'</div><div class="t2">'+fmtDateBR(d.data)+'</div></div>'+

  document.getElementById('cfg-logo').addEventListener('change', e=>{

  document.getElementById('cfg-save').addEventListener('click', async ()=>{
    DB.config.nome = document.getElementById('cfg-nome').value.trim() || 'Celia Decorações';

  });
  document.getElementById('cfg-export').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'celia-decoracoes-backup.json'; a.click();
  });
  document.getElementById('cfg-import').addEventListener('click', ()=>document.getElementById('cfg-import-file').click());
  document.getElementById('cfg-import-file').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{

    };
    reader.readAsText(file);
  });
  document.getElementById('cfg-reset').addEventListener('click', async ()=>{

  });
}

/* ======================================================================
   DOCUMENTO (Orçamento / Recibo)
   ====================================================================== */
function viewDocumento(id){
  const p = DB.pedidos.find(x=>x.id===id);
  if(!p){ return '<div class="empty">'+ic('tag',44)+'<h4>Pedido não encontrado</h4></div>'; }
  const cli = findCliente(p.clienteId);
  const cfg = DB.config;
  const itens = [];
  (p.produtos||[]).forEach(i=>{ const pr=findProduto(i.id); if(pr){ const b=pr.preco*i.qtd; const desc=Math.min(Number(i.desconto)||0,b); itens.push({nome:pr.nome, unit:pr.preco, unidade:pr.unidade, qtd:i.qtd, desconto:desc, total:b-desc}); } });
  (p.servicos||[]).forEach(i=>{ const sv=findServico(i.id); if(sv){ const b=sv.preco*i.qtd; const desc=Math.min(Number(i.desconto)||0,b); itens.push({nome:sv.nome, unit:sv.preco, unidade:'pacote', qtd:i.qtd, desconto:desc, total:b-desc}); } });
  (p.terceirizados||[]).forEach(t=>{ itens.push({nome:t.empresa+' — '+t.item, unit:t.valor, unidade:'', qtd:t.qtd, desconto:0, total:t.qtd*t.valor, obsItem:t.obs}); });
  const descontoItensTotal = itens.reduce((s,i)=>s+i.desconto,0);
  const subtotal = itens.reduce((s,i)=>s+i.total,0) + descontoItensTotal;
  const total = pedidoTotal(p);
  const ev = p.evento || {};
  const tipoLabel = ev.tipo==='Outro'? (ev.tipoOutro||'Outro') : ev.tipo;
  const evPartes = [];
  if(ev.tema) evPartes.push('Tema: '+ev.tema);
  if(ev.nome) evPartes.push((ev.idade? (ev.nome+' ('+ev.idade+' anos)') : ev.nome));
  if(tipoLabel) evPartes.push('Tipo: '+tipoLabel);
  if(ev.horario) evPartes.push('Horário do evento: '+ev.horario);
  const eventoLinha = evPartes.join(' · ');
  state.docModel = state.docModel || 'A';

  return ''+
  '<div class="page-head"><div class="flex gap-8" style="align-items:center"><button class="icon-btn" style="background:#F5EAF0;color:#2B1A26" data-back-pedido="'+p.id+'">'+ic('back',18)+'</button><div><h2>Documento</h2><p class="sub">Pedido #'+String(p.numero).padStart(5,'0')+'</p></div></div>'+
    '<button class="icon-btn" style="background:#F5EAF0;color:#2B1A26" id="doc-print">'+ic('print',19)+'</button></div>'+
  '<div class="doc-tabs"><button class="chip'+(state.docModel==='A'?' active':'')+'" data-model="A">Modelo A</button><button class="chip'+(state.docModel==='B'?' active':'')+'" data-model="B">Modelo B</button></div>'+
  '<div id="print-area">'+
  '<div class="receipt'+(state.docModel==='B'?' modelB':'')+'" id="receipt-el">'+
    '<div class="rhead">'+
      '<div class="co"><div style="width:44px;height:44px;flex:0 0 auto">'+(cfg.logo?('<img src="'+cfg.logo+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover">'):LOGO_SVG)+'</div>'+
        '<div><b style="font-family:var(--font-display);font-size:15px">'+escapeHtml(cfg.nome)+'</b><small>'+escapeHtml(cfg.endereco||'')+(cfg.telefone?(' · '+escapeHtml(cfg.telefone)):'')+'</small></div></div>'+
      '<div class="meta">Pedido nº<b>'+String(p.numero).padStart(5,'0')+'</b>Data<b>'+fmtDateBR(p.data)+(p.horario?(' às '+p.horario):'')+'</b></div>'+
    '</div>'+
    '<div class="rbody">'+
      '<div class="cliente"><b>'+escapeHtml(cli?cli.nome:'Cliente não definido')+'</b>'+escapeHtml(cli?(cli.telefone||cli.email||''):'')+'</div>'+
      (eventoLinha? '<div class="obs"><b>Evento:</b> '+escapeHtml(eventoLinha)+'</div>' : '')+
      '<table><thead><tr><th>Item</th><th>Valor Unit.</th><th>Qtd.</th><th>Total</th></tr></thead><tbody>'+
        itens.map(i=>'<tr><td>'+escapeHtml(i.nome)+
          (i.obsItem?('<br><small style="color:var(--text-soft);font-weight:600">'+escapeHtml(i.obsItem)+'</small>'):'')+
          (i.desconto>0?('<br><small style="color:var(--pink-dark);font-weight:700">Desconto: -'+fmtMoney(i.desconto)+'</small>'):'')+
          '</td><td>'+fmtMoney(i.unit)+'</td><td>'+i.qtd+' '+escapeHtml(i.unidade||'')+'</td><td>'+fmtMoney(i.total)+'</td></tr>').join('')+
      '</tbody></table>'+
      '<div class="totals">'+
        '<div class="r"><span>Subtotal</span><span>'+fmtMoney(subtotal)+'</span></div>'+
        (descontoItensTotal>0? '<div class="r"><span>Desconto nos itens</span><span>- '+fmtMoney(descontoItensTotal)+'</span></div>' : '')+
        '<div class="r"><span>Desconto geral</span><span>- '+fmtMoney(p.desconto||0)+'</span></div>'+
        '<div class="r grand"><span>Total</span><span>'+fmtMoney(total)+'</span></div>'+
      '</div>'+
      (p.obs? '<div class="obs"><b>Observações:</b> '+escapeHtml(p.obs)+'</div>':'')+
      (p.garantia? '<div class="obs"><b>Garantia:</b> '+escapeHtml(p.garantia)+'</div>':'')+
      '<div class="foot"><div>'+escapeHtml(cfg.nome)+'</div><div>'+escapeHtml(cli?cli.nome:'Cliente')+'</div></div>'+
    '</div>'+
  '</div>'+
  '</div>'+
  '<button class="btn btn-gold btn-block mt-16" id="doc-share">'+ic('share',18)+' Compartilhar PDF pelo WhatsApp</button>'+
  '<button class="btn btn-ghost btn-block mt-8" id="doc-download">'+ic('download',18)+' Baixar PDF</button>';
}
function bindDocumento(id){
  document.querySelector('[data-back-pedido]').addEventListener('click',()=>navigate('pedido-form',{id}));
  document.querySelectorAll('[data-model]').forEach(el=>el.addEventListener('click',()=>{ state.docModel = el.dataset.model; renderView(); }));
  document.getElementById('doc-print').addEventListener('click',()=>window.print());
  document.getElementById('doc-share').addEventListener('click',()=>gerarPdfECompartilhar(id, true));
  document.getElementById('doc-download').addEventListener('click',()=>gerarPdfECompartilhar(id, false));

async function gerarPdfECompartilhar(pedidoId, compartilhar){
  const p = DB.pedidos.find(x=>x.id===pedidoId);
  const cli = findCliente(p.clienteId);
  const el = document.getElementById('receipt-el');
  if(!window.html2canvas || !window.jspdf){ toast('Não foi possível carregar o gerador de PDF (verifique sua conexão)','err'); return; }
  toast('Gerando PDF...','ok');
  try{
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff'});
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4'});
    const pageW = pdf.internal.pageSize.getWidth();
    const imgW = pageW - 60;
    const imgH = canvas.height * (imgW/canvas.width);
    pdf.addImage(imgData,'PNG',30,30,imgW,imgH);
    const filename = 'Pedido-'+String(p.numero).padStart(5,'0')+'-CeliaDecoracoes.pdf';
    const blob = pdf.output('blob');

    if(compartilhar){
      const texto = 'Olá'+(cli?(', '+cli.nome):'')+'! Segue o orçamento/recibo do seu evento com a Celia Decorações 🎈 Pedido #'+String(p.numero).padStart(5,'0')+' — Total: '+fmtMoney(pedidoTotal(p));
      const file = new File([blob], filename, {type:'application/pdf'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:filename, text:texto}); toast('PDF compartilhado!','ok'); return; }catch(e){ /* fall through to fallback */ }
      }
      // fallback: download + open whatsapp chat (with client's number if available)
      downloadBlob(blob, filename);
      const link = cli && cli.telefone ? waLink(cli.telefone, texto) : waLink('', texto);
      window.open(link, '_blank');
      toast('PDF baixado. Anexe o arquivo na conversa do WhatsApp.','ok');
    }else{
      downloadBlob(blob, filename);
      toast('PDF baixado com sucesso','ok');
    }
  }catch(err){
    console.error(err);
    toast('Erro ao gerar PDF','err');
  }
}
function downloadBlob(blob, filename){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}

/* ======================================================================
   PWA — INSTALAÇÃO DO APLICATIVO ("Instalar App")
   Funciona em:
   - Android / Chrome, Edge, Samsung Internet, Opera → prompt nativo real
   - Windows / macOS / Linux (Chrome, Edge) → prompt nativo real
   - iOS / iPadOS (Safari) → instruções guiadas (Apple não permite prompt
     automático de instalação; é uma limitação do sistema, não do app)
   ====================================================================== */
let deferredInstallPrompt = null;

function isStandaloneMode(){
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.matchMedia('(display-mode: window-controls-overlay)').matches ||
         window.navigator.standalone === true; // iOS Safari (já instalado)
}
function isIOSDevice(){
  const ua = window.navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Macintosh') && 'ontouchend' in document);
  return isIOS;
}
function isAndroidDevice(){ return /Android/i.test(window.navigator.userAgent||''); }

// Captura o evento assim que o navegador o disponibiliza (pode ocorrer
// antes mesmo do login, então fica fora de qualquer função de render).
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  toggleInstallButtonsVisibility();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  toggleInstallButtonsVisibility();
  toast('Agenda Celia instalado com sucesso! 🎈','ok');
});

function toggleInstallButtonsVisibility(){
  const btn = document.getElementById('btn-install');
  if(!btn) return;
  if(isStandaloneMode()){ btn.classList.remove('show'); return; }
  if(deferredInstallPrompt || isIOSDevice()){ btn.classList.add('show'); }
  else { btn.classList.remove('show'); }
}

function bindInstallButton(){
  // O topbar (e o botão) é recriado do zero a cada chamada de render(),
  // então é seguro (e necessário) reatribuir o listener sempre — o
  // elemento antigo, com seu listener antigo, já foi descartado do DOM.
  const btn = document.getElementById('btn-install');
  if(!btn) return;
  toggleInstallButtonsVisibility();
  btn.addEventListener('click', onClickInstallButton);
}
function onClickInstallButton(){
  if(isIOSDevice() && !deferredInstallPrompt){
    showIosInstallModal();
    return;
  }
  if(!deferredInstallPrompt){
    toast('Este navegador já instalou o app, ou não oferece suporte à instalação automática. Use o menu do navegador → "Instalar app" / "Adicionar à tela inicial".','err');
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then((choice)=>{
    if(choice && choice.outcome==='accepted'){ toast('Instalando o Agenda Celia...','ok'); }
    deferredInstallPrompt = null;
    toggleInstallButtonsVisibility();
  }).catch(()=>{});
}
function showIosInstallModal(){
  openModal({
    title:'Instalar no seu iPhone/iPad',
    center:true,
    body:
      '<ul class="ios-steps">'+
        '<li><span class="num">1</span><div>Toque no ícone de <b>Compartilhar</b> '+ic('share',18)+' na barra do Safari (parte inferior ou superior da tela).</div></li>'+
        '<li><span class="num">2</span><div>Role a lista de opções e toque em <b>"Adicionar à Tela de Início"</b>.</div></li>'+
        '<li><span class="num">3</span><div>Toque em <b>"Adicionar"</b> no canto superior direito. Pronto! O Agenda Celia aparecerá como um app normal, com ícone próprio e tela cheia.</div></li>'+
      '</ul>',
    foot:'<button class="btn btn-primary btn-block" data-close>Entendi</button>'
  });
}

function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then((reg)=>{
      // Verifica periodicamente se há uma nova versão do app disponível
      reg.addEventListener('updatefound', ()=>{
        const novo = reg.installing;
        if(!novo) return;
        novo.addEventListener('statechange', ()=>{
          if(novo.state==='installed' && navigator.serviceWorker.controller){
            toast('Nova versão do Agenda Celia disponível. Atualize a página.','ok');
          }
        });
      });
    }).catch((err)=>{ console.warn('[SW] Falha ao registrar service worker:', err); });
  });
}

/* ======================================================================
   BOOT
   ====================================================================== */
(async function boot(){
  registerServiceWorker();
  const loaded = await dbLoad();
  if(loaded){ DB = Object.assign(defaultDB(), loaded); }
  render();
})();

})();
</script>
